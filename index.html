<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171a21"><title>Steam Family Randomizer</title><style>:root{color-scheme:dark;--bg:#0e141b;--panel:#192636;--panel2:#203247;--line:#334b63;--text:#f5f8fa;--muted:#9fb1c2;--blue:#66c0f4;--blue2:#1a9fff;--green:#75b022;--warn:#efc66d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% -20%,#294969 0,transparent 42%),linear-gradient(180deg,#171f2a,var(--bg));color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(680px,100%)}.card{border:1px solid var(--line);background:rgba(25,38,54,.96);border-radius:24px;padding:clamp(24px,5vw,44px);box-shadow:0 22px 70px rgba(0,0,0,.34)}.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 7px;font-weight:850;font-size:clamp(22px,5vw,34px)}.brand-mark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#142130;font-size:19px}.subtitle{margin:0 0 28px;text-align:center;color:var(--muted);font-size:14px}.pick{width:100%;min-height:66px;border:0;border-radius:16px;padding:15px 22px;font-size:clamp(17px,4vw,20px);font-weight:850;color:#06131d;background:linear-gradient(135deg,var(--blue),var(--blue2));cursor:pointer;transition:transform .12s ease,filter .12s ease}.pick:hover{filter:brightness(1.08)}.pick:active{transform:scale(.986)}.pick:disabled{opacity:.58;cursor:wait}.result{display:none;margin-top:25px;padding:24px;border:1px solid var(--line);border-radius:17px;background:var(--panel2)}.result.show{display:block}.label{margin:0 0 7px;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.11em}h1{margin:0;font-size:clamp(27px,6vw,42px);line-height:1.08;overflow-wrap:anywhere}.status{min-height:23px;margin:13px 0 0;color:var(--muted);font-size:14px;line-height:1.45}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:#8bd18b}.dot.warn{background:var(--warn)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:19px}.link{min-height:48px;display:inline-flex;align-items:center;justify-content:center;padding:11px 17px;border-radius:12px;text-decoration:none;font-weight:800}.primary{color:#fff;background:var(--green)}.secondary{color:var(--blue);border:1px solid var(--line);background:#172536}.hidden{display:none!important}.meta{margin-top:14px;color:var(--muted);font-size:12px}.footer{margin:18px 0 0;text-align:center;color:#74889a;font-size:11px;line-height:1.45}@media(max-width:520px){body{padding:13px}.card{padding:22px 17px}.actions .link{width:100%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main><section class="card"><div class="brand"><span class="brand-mark">S</span> Steam Family Randomizer</div><p class="subtitle"><strong>1.061</strong> entradas de la colección · una sola decisión</p><button id="pick" class="pick" type="button">🎲 ¿QUÉ JUGAMOS?</button><section id="result" class="result" aria-live="polite"><p class="label">El destino eligió</p><h1 id="gameName"></h1><p id="status" class="status"></p><div class="actions"><a id="steamLink" class="link primary hidden" target="_blank" rel="noopener noreferrer">Ver directamente en Steam ↗</a><a id="searchLink" class="link secondary hidden" target="_blank" rel="noopener noreferrer">Buscar en Steam ↗</a></div><div id="meta" class="meta"></div></section><p class="footer">La selección es local y aleatoria. Si una coincidencia con Steam no es suficientemente segura, la app no inventa un enlace.</p></section></main><script src="games-a.js"></script><script src="games-b.js"></script><script src="appids.js"></script><script src="app.js"></script></body></html>
